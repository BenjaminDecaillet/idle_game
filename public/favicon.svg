<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fav-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ec6f5"/>
      <stop offset="1" stop-color="#cdefff"/>
    </linearGradient>
    <linearGradient id="fav-bld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#ff8a2a"/>
    </linearGradient>
  </defs>
  <!-- rounded tile: sunny sky -->
  <rect width="512" height="512" rx="112" fill="url(#fav-sky)" stroke="#2d2440" stroke-width="18"/>
  <!-- sun -->
  <circle cx="392" cy="128" r="52" fill="#ffc93c" stroke="#2d2440" stroke-width="14"/>
  <!-- cloud -->
  <g fill="#ffffff" stroke="#2d2440" stroke-width="12" stroke-linejoin="round">
    <path d="M96 150 q10 -34 46 -30 q12 -26 42 -20 q28 6 26 32 q28 4 22 30 q-6 22 -34 20 l-78 0 q-28 -4 -24 -32 z"/>
  </g>
  <!-- startup HQ -->
  <g stroke="#2d2440" stroke-linejoin="round">
    <rect x="128" y="176" width="200" height="264" rx="26" fill="url(#fav-bld)" stroke-width="16"/>
    <rect x="328" y="256" width="102" height="184" rx="22" fill="#38b6ff" stroke-width="16"/>
    <!-- windows -->
    <g fill="#fff8ec" stroke-width="10">
      <rect x="160" y="212" width="52" height="52" rx="12"/>
      <rect x="244" y="212" width="52" height="52" rx="12"/>
      <rect x="160" y="296" width="52" height="52" rx="12"/>
      <rect x="244" y="296" width="52" height="52" rx="12"/>
    </g>
    <g fill="#fff8ec" stroke-width="9">
      <rect x="352" y="284" width="54" height="34" rx="10"/>
      <rect x="352" y="340" width="54" height="34" rx="10"/>
    </g>
    <!-- door -->
    <rect x="196" y="368" width="64" height="72" rx="14" fill="#2d2440" stroke-width="12"/>
    <!-- flag on the roof -->
    <rect x="216" y="108" width="14" height="76" rx="7" fill="#2d2440" stroke-width="0"/>
    <path d="M230 116 l64 18 l-64 18 z" fill="#2fbf6b" stroke-width="12"/>
  </g>
  <!-- ground -->
  <path d="M64 440 h384" stroke="#2d2440" stroke-width="18" stroke-linecap="round"/>
</svg>
