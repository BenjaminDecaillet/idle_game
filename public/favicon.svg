      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b0f1a"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg)" opacity="0.18"/>
  <!-- rising bar chart = company growth -->
  <rect x="112" y="296" width="64" height="120" rx="14" fill="#6366f1"/>
  <rect x="224" y="216" width="64" height="200" rx="14" fill="#818cf8"/>
  <rect x="336" y="120" width="64" height="296" rx="14" fill="#22d3ee"/>
  <!-- dollar coin -->
